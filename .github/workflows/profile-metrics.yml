name: Refresh profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the collector
        run: node --test test/metrics.test.mjs
      - name: Generate public metrics
        run: node scripts/generate-metrics.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: Lifelessdice
      - name: Commit updated assets
        shell: bash
        run: |
          git add -- assets/header.svg assets/github-metrics.svg data/public-metrics.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public profile metrics [skip ci]'
          git push
